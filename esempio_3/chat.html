<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Chatbot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 480px;
      height: 620px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .chat-header {
      padding: 16px 20px;
      background: #1a1a1a;
      color: white;
      font-size: 15px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-header .dot {
      width: 9px; height: 9px;
      background: #4ade80;
      border-radius: 50%;
    }

    /* Messaggi */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    /* Messaggio utente — destra */
    .message.user {
      align-self: flex-end;
      background: #1a1a1a;
      color: white;
      border-bottom-right-radius: 4px;
    }

    /* Messaggio bot — sinistra */
    .message.bot {
      align-self: flex-start;
      background: #f0f0f0;
      color: #1a1a1a;
      border-bottom-left-radius: 4px;
    }

    /* Badge intent */
    .intent-badge {
      align-self: flex-start;
      font-size: 11px;
      color: #888;
      padding: 2px 8px;
      background: #f5f5f5;
      border-radius: 99px;
      margin-top: -6px;
    }

    /* Typing indicator */
    .typing {
      align-self: flex-start;
      background: #f0f0f0;
      border-radius: 14px;
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      display: flex;
      gap: 5px;
    }
    .typing span {
      width: 7px; height: 7px;
      background: #aaa;
      border-radius: 50%;
      animation: bounce 1s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.30s; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-5px); }
    }

    /* Input */
    .chat-input {
      display: flex;
      padding: 12px 16px;
      gap: 10px;
      border-top: 1px solid #eee;
    }
    .chat-input input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 99px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .chat-input input:focus { border-color: #1a1a1a; }

    .chat-input button {
      padding: 10px 18px;
      background: #1a1a1a;
      color: white;
      border: none;
      border-radius: 99px;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .chat-input button:hover   { opacity: 0.85; }
    .chat-input button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
<div class="chat-container">
  <div class="chat-header">
    <div class="dot"></div>
    Assistente virtuale
  </div>

  <div class="chat-messages" id="messages">
    <div class="message bot">Ciao! Come posso aiutarti? 😊</div>
  </div>

  <div class="chat-input">
    <input id="input" type="text" placeholder="Scrivi un messaggio..." autofocus>
    <button id="send">Invia</button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("input");
  const sendBtn    = document.getElementById("send");

  let sessionId = null;   // null = nuova sessione al primo messaggio

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addMessage(text, role) {
    const div = document.createElement("div");
    div.className = `message ${role}`;
    div.textContent = text;
    messagesEl.appendChild(div);
    scrollBottom();
    return div;
  }

  function addBadge(intent) {
    if (!intent) return;
    const badge = document.createElement("div");
    badge.className = "intent-badge";
    badge.textContent = `↳ ${intent}`;
    messagesEl.appendChild(badge);
    scrollBottom();
  }

  function showTyping() {
    const div = document.createElement("div");
    div.className = "typing";
    div.id = "typing";
    div.innerHTML = "<span></span><span></span><span></span>";
    messagesEl.appendChild(div);
    scrollBottom();
    return div;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    // Mostra messaggio utente e blocca input
    addMessage(text, "user");
    inputEl.value = "";
    inputEl.disabled = true;
    sendBtn.disabled = true;

    // Mostra indicatore di digitazione
    const typing = showTyping();

    try {
      const res  = await fetch("/chat", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ session_id: sessionId, message: text })
      });
      const data = await res.json();

      sessionId = data.session_id;   // salva per i turni successivi

      typing.remove();
      addMessage(data.reply, "bot");
      addBadge(data.intent);

    } catch (err) {
      typing.remove();
      addMessage("Errore di connessione. Riprova.", "bot");
    }

    inputEl.disabled = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
  });
</script>
</body>
</html>
